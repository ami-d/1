<script>
/*
  QUANT-SHIELD V18 ULTIMATE
  ========================================
  NEXT-GENERATION ALGORITHM FEATURES:
  ✓ Multi-level pattern recognition (L1, L2, L3)
  ✓ Recursive trend analysis across timeframes

  ✓ Bias correction for repeating patterns

// ============ LEVEL 1: MICRO PATTERN ANALYZER (Core Engine) ============
class MicroPatternAnalyzer {
  analyze(history, depth=3) {
    const sizes = history.map(h => h.size);
    if(sizes.length < depth) return this._emptyResult();

    const results = {
      immediate: this._analyzeImmediate(sizes),
      short: this._analyzeShort(sizes),
      medium: this._analyzeMedium(sizes),
      long: this._analyzeLong(sizes),
      momentum: this._analyzeMomentum(sizes),
      reversal: this._analyzeReversal(sizes),
      clustering: this._analyzeClustering(sizes),
      alternation: this._analyzeAlternation(sizes),
      fusion: null
    };

    results.fusion = this._fusionScore(results);
    return results;
  }

  _analyzeImmediate(sizes) {
    const last3 = sizes.slice(0, 3);
    const bigCount = last3.filter(s => s === 'BIG').length;
    const signal = bigCount >= 2 ? 'BIG' : 'SMALL';
    const confidence = 0.5 + (Math.abs(bigCount - 1.5) / 3) * 0.4;
    return { signal, confidence: Math.min(0.99, confidence), pattern: 'IMMEDIATE', strength: bigCount };
  }

  _analyzeShort(sizes) {
    const short5 = sizes.slice(0, 5);
    const bigCount = short5.filter(s => s === 'BIG').length;
    const ratio = bigCount / short5.length;
    
    let consec = 0, maxConsec = 0, lastVal = null;
    for(let s of short5) {
      if(s === lastVal) consec++; else { maxConsec = Math.max(maxConsec, consec); consec = 1; lastVal = s; }
    }
    maxConsec = Math.max(maxConsec, consec);

    const signal = ratio > 0.5 ? 'BIG' : 'SMALL';
    const confidence = 0.55 + (Math.abs(ratio - 0.5) * 0.35) + (maxConsec * 0.1);
    return { signal, confidence: Math.min(0.95, confidence), pattern: 'SHORT', strength: maxConsec };
  }

  _analyzeMedium(sizes) {
    const medium10 = sizes.slice(0, Math.min(10, sizes.length));
    const bigCount = medium10.filter(s => s === 'BIG').length;
    const ratio = bigCount / medium10.length;

    let runStart = 0, maxRun = 0;
    for(let i = 1; i < medium10.length; i++) {
      if(medium10[i] !== medium10[i-1]) {
        maxRun = Math.max(maxRun, i - runStart);
        runStart = i;
      }
    }
    maxRun = Math.max(maxRun, medium10.length - runStart);

    const signal = ratio > 0.5 ? 'BIG' : 'SMALL';
    const confidence = 0.58 + (Math.abs(ratio - 0.5) * 0.3) + (Math.min(maxRun, 5) * 0.08);
    return { signal, confidence: Math.min(0.93, confidence), pattern: 'MEDIUM', strength: maxRun };
  }

  _analyzeLong(sizes) {
    const long20 = sizes.slice(0, Math.min(20, sizes.length));
    const bigCount = long20.filter(s => s === 'BIG').length;
    const ratio = bigCount / long20.length;
    const signal = ratio > 0.5 ? 'BIG' : 'SMALL';
    const confidence = 0.60 + (Math.abs(ratio - 0.5) * 0.25);
    return { signal, confidence: Math.min(0.92, confidence), pattern: 'LONG', strength: bigCount };
  }

  _analyzeMomentum(sizes) {
    const seg1 = sizes.slice(0, Math.min(3, sizes.length)).filter(s => s === 'BIG').length;
    const seg2 = sizes.slice(3, Math.min(7, sizes.length)).filter(s => s === 'BIG').length;
    const seg3 = sizes.slice(7, Math.min(12, sizes.length)).filter(s => s === 'BIG').length;

    let trend = 'FLAT';
    let momentum = 0.5;
    if(seg1 > seg2 && seg2 > seg3) { trend = 'ACCELERATING_DOWN'; momentum = 0.75; }
    else if(seg1 < seg2 && seg2 < seg3) { trend = 'ACCELERATING_UP'; momentum = 0.75; }
    else if(seg1 >= seg2 && seg2 >= seg3) { trend = 'STABLE_DOWN'; momentum = 0.65; }
    else if(seg1 <= seg2 && seg2 <= seg3) { trend = 'STABLE_UP'; momentum = 0.65; }

    const signal = momentum > 0.5 ? (trend.includes('UP') ? 'BIG' : 'SMALL') : 'NEUTRAL';
    return { signal, confidence: momentum, pattern: trend, strength: Math.abs(seg1 - seg3) };
  }

  _analyzeReversal(sizes) {
    if(sizes.length < 4) return { signal: 'NEUTRAL', confidence: 0.5, pattern: 'NO_REVERSAL', strength: 0 };

    const last2 = sizes.slice(0, 2);
    const prev2 = sizes.slice(2, 4);
    const same = (last2[0] === last2[1]) && (prev2[0] === prev2[1]) && (last2[0] !== prev2[0]);

    if(same) {
      const signal = last2[0];
      return { signal, confidence: 0.82, pattern: 'REVERSAL_CONFIRMED', strength: 2 };
    }
    return { signal: 'NEUTRAL', confidence: 0.5, pattern: 'NO_REVERSAL', strength: 0 };
  }

  _analyzeClustering(sizes) {
    let maxCluster = 1, currentCluster = 1, lastVal = sizes[0];
    for(let i = 1; i < sizes.length; i++) {
      if(sizes[i] === lastVal) currentCluster++;
      else { maxCluster = Math.max(maxCluster, currentCluster); currentCluster = 1; lastVal = sizes[i]; }
    }
    maxCluster = Math.max(maxCluster, currentCluster);

    const signal = lastVal;
    const confidence = 0.55 + (Math.min(maxCluster, 4) * 0.12);
    return { signal, confidence: Math.min(0.95, confidence), pattern: 'CLUSTERING', strength: maxCluster };
  }

  _analyzeAlternation(sizes) {
    let alternates = 0;
    for(let i = 1; i < Math.min(sizes.length, 12); i++) {
      if(sizes[i] !== sizes[i-1]) alternates++;
      else break;
    }

    if(alternates >= 4) {
      const next = sizes[0] === 'BIG' ? 'SMALL' : 'BIG';
      const confidence = 0.60 + (Math.min(alternates - 3, 4) * 0.08);
      return { signal: next, confidence: Math.min(0.88, confidence), pattern: 'ALTERNATION', strength: alternates };
    }
    return { signal: 'NEUTRAL', confidence: 0.5, pattern: 'NO_ALTERNATION', strength: 0 };
  }

  _fusionScore(results) {
    const signals = Object.values(results).filter(r => r && r.signal && r.signal !== 'NEUTRAL');
    if(signals.length === 0) return { signal: 'NEUTRAL', confidence: 0.5, pattern: 'NO_CONSENSUS' };

    const bigVotes = signals.filter(r => r.signal === 'BIG').length;
    const smallVotes = signals.filter(r => r.signal === 'SMALL').length;
    const avgConf = signals.reduce((a, b) => a + b.confidence, 0) / signals.length;

    const signal = bigVotes > smallVotes ? 'BIG' : 'SMALL';
    const consensus = Math.max(bigVotes, smallVotes) / signals.length;
    const confidence = 0.62 + (consensus * 0.25) + (avgConf * 0.08);

    return { signal, confidence: Math.min(0.99, confidence), pattern: 'FUSION_ENSEMBLE', strength: Math.max(bigVotes, smallVotes) };
  }

  _emptyResult() {
    return {
      immediate: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      short: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      medium: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      long: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      momentum: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      reversal: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      clustering: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      alternation: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' },
      fusion: { signal: 'NEUTRAL', confidence: 0.5, pattern: 'EMPTY' }
    };
  }
}

// ============ LEVEL 2: ADVANCED DECISION ENGINE ============
class AdvancedDecisionEngine {
  constructor() {
    this.history = [];
    this.predictions = [];
    this.wins = 0;
    this.losses = 0;
    this.consecutiveWins = 0;
    this.consecutiveLosses = 0;
    this.lastActual = null;
    this.maxHistory = 3000;

    this.analyzer = new MicroPatternAnalyzer();
    this.strategy = 'ANALYZING';
    this.confidence = 0;
    this.trend = 'NEUTRAL';
    this.level = 1;

    this.antiLossThreshold = 0.86;
    this.passThreshold = 0.65;
    this.maxConsecutiveLosses = 0;
    this.lastLostSignal = null;
    this.lossRecoveryMode = false;
  }

  insert(node) {
    if(this.predictions.length > 0) {
      const lastPred = this.predictions[this.predictions.length - 1];
      if(lastPred.signal && lastPred.signal !== 'PASS') {
        const isWin = lastPred.signal === node.size;
        this.lastActual = node.size;

        if(isWin) {
          this.wins++;
          this.consecutiveWins++;
          this.consecutiveLosses = 0;
          this.lossRecoveryMode = false;
          postLog(`✅ LEVEL-${this.level} WIN: ${lastPred.signal} @ ${lastPred.confidence}%`);
        } else {
          this.losses++;
          this.consecutiveLosses++;
          this.consecutiveWins = 0;
          this.lastLostSignal = lastPred.signal;
          this.lossRecoveryMode = true;
          postLog(`❌ LEVEL-${this.level} LOSS: ${lastPred.signal} → ${node.size} @ ${lastPred.confidence}%`);

          if(this.consecutiveLosses >= 1) {
            this.level = Math.min(3, this.level + 1);
            postLog(`🚨 ESCALATING TO LEVEL-${this.level} (Anti-Loss Recovery)`);
          }
        }
      }
    }

    this.history.unshift(node);
    if(this.history.length > this.maxHistory) this.history.pop();
    return true;
  }

  computeSignal(period) {
    if(this.history.length < 3) {
      const s = Math.random() > 0.5 ? 'BIG' : 'SMALL';
      this.predictions.push({ period, signal: s, confidence: 50, strategy: 'INITIAL' });
      return { signal: s, confidence: 50 };
    }

    const analysis = this.analyzer.analyze(this.history);

    if(this.level === 1) {
      const fusion = analysis.fusion;
      if(fusion.confidence >= this.antiLossThreshold) {
        this.strategy = 'LEVEL-1::FUSION_ENSEMBLE';
        const conf = Math.round(fusion.confidence * 100);
        this.predictions.push({ period, signal: fusion.signal, confidence: conf, strategy: this.strategy });
        postLog(`▶️ L1 TRADE: ${fusion.signal} (${conf}%)`);
        return { signal: fusion.signal, confidence: conf };
      }
    }

    if(this.level >= 2 || this.lossRecoveryMode) {
      const consensus = this._multiAngleConsensus(analysis);
      if(consensus.confidence >= 0.82) {
        this.strategy = `LEVEL-${this.level}::MULTI_ANGLE`;
        const conf = Math.round(consensus.confidence * 100);
        this.predictions.push({ period, signal: consensus.signal, confidence: conf, strategy: this.strategy });
        postLog(`▶️ L${this.level} TRADE: ${consensus.signal} (${conf}% Multi-Angle)`);
        return { signal: consensus.signal, confidence: conf };
      }
    }

    if(this.level >= 3) {
      const reversal = analysis.reversal;
      if(reversal.pattern === 'REVERSAL_CONFIRMED' && reversal.confidence >= 0.75) {
        this.strategy = 'LEVEL-3::REVERSAL_CONFIRMED';
        const conf = Math.round(reversal.confidence * 100);
        this.predictions.push({ period, signal: reversal.signal, confidence: conf, strategy: this.strategy });
        postLog(`▶️ L3 REVERSAL: ${reversal.signal} (${conf}% - Reversal Pattern)`);
        return { signal: reversal.signal, confidence: conf };
      }

      const clustering = analysis.clustering;
      if(clustering.strength >= 3 && clustering.confidence >= 0.80) {
        this.strategy = 'LEVEL-3::CLUSTERING_MIMIC';
        const conf = Math.round(clustering.confidence * 100);
        this.predictions.push({ period, signal: clustering.signal, confidence: conf, strategy: this.strategy });
        postLog(`▶️ L3 CLUSTER: ${clustering.signal} (${conf}% - Pattern Repeat)`);
        return { signal: clustering.signal, confidence: conf };
      }
    }

    if(this.consecutiveLosses > 0 && !this.lossRecoveryMode) {
      this.strategy = 'ANTI_LOSS::PASS';
      this.predictions.push({ period, signal: 'PASS', confidence: 0, strategy: this.strategy });
      postLog(`⏸️ PASS: Avoiding consecutive loss`);
      return { signal: 'PASS', confidence: 0 };
    }

    this.strategy = 'LOW_CONFIDENCE';
    this.predictions.push({ period, signal: 'PASS', confidence: 0, strategy: this.strategy });
    postLog(`⏸️ PASS: Insufficient confidence`);
    return { signal: 'PASS', confidence: 0 };
  }

  _multiAngleConsensus(analysis) {
    const angles = [analysis.clustering, analysis.momentum, analysis.medium, analysis.short];
    const votes = {};

    for(const angle of angles) {
      if(angle.signal && angle.signal !== 'NEUTRAL') {
        votes[angle.signal] = (votes[angle.signal] || 0) + angle.confidence;
      }
    }

    const winner = Object.keys(votes).reduce((a, b) => votes[a] > votes[b] ? a : b, 'NEUTRAL');
    if(winner === 'NEUTRAL') return { signal: 'NEUTRAL', confidence: 0.5 };

    const confidence = votes[winner] / Object.keys(votes).length;
    return { signal: winner, confidence: Math.min(0.96, confidence) };
  }

  getWinRate() {
    const total = this.wins + this.losses;
    return total === 0 ? 0 : ((this.wins / total) * 100).toFixed(1);
  }

  reset() {
    this.history = [];
    this.predictions = [];
    this.wins = 0;
    this.losses = 0;
    this.consecutiveWins = 0;
    this.consecutiveLosses = 0;
    this.level = 1;
    this.lossRecoveryMode = false;
    postLog('🔄 ENGINE RESET');
  }
}

// ============ API BRIDGE ============
class ReliableWinGoAPI {
  constructor(engine) {
    this.engine = engine;
    this.isPolling = false;
    this.pollInterval = 1100;
  }

  getEndpoints() {
    const t = Date.now();
    return [
      `https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=50&pageNo=1&_t=${t}`,
      `https://bet.8bgame.net/WinGo/WinGo_30S/GetHistoryIssuePage.json?pageSize=50&_t=${t}`,
      `https://api.bdg88zf.com/api/webapi/GetEmerdList?gameType=1&language=0&pageNo=1&pageSize=100&typeId=2&_t=${t}`,
      `https://lottery.ubet365.net/api/history/wingo30s?page=1&pageSize=100&_t=${t}`,
    ];
  }

  async fetchWithTimeout(url, timeoutMs = 5000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const r = await fetch(url, { method: 'GET', signal: controller.signal, mode: 'cors', cache: 'no-store' });
      clearTimeout(id);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch(e) { clearTimeout(id); throw e; }
  }

  parseWinGoData(json) {
    let items = [];
    if(json?.data?.list) items = json.data.list;
    else if(json?.data?.records) items = json.data.records;
    else if(json?.records) items = json.records;
    else if(json?.list) items = json.list;
    else if(Array.isArray(json)) items = json;

    const out = [];
    for(const it of items) {
      try {
        const period = it.issueNumber || it.issue || it.periodNumber || it.period || it.id;
        let num = null;
        if(it.number !== undefined) num = parseInt(String(it.number).replace(/\D/g, ''), 10);
        else if(it.openNumber !== undefined) num = parseInt(String(it.openNumber).replace(/\D/g, ''), 10);
        else if(it.result !== undefined) num = parseInt(String(it.result).replace(/\D/g, ''), 10);

        if(period !== undefined && !isNaN(num) && num >= 0 && num <= 9) {
          out.push({ period: String(period), number: num, size: num >= 5 ? 'BIG' : 'SMALL' });
        }
      } catch(e) { continue; }
    }
    return out;
  }

  async poll() {
    if(this.isPolling) return;
    this.isPolling = true;

    const eps = this.getEndpoints();
    let data = null, used = null;
    for(const u of eps) {
      try { data = await this.fetchWithTimeout(u); used = u; break; } catch(e) { continue; }
    }

    if(data) {
      const recs = this.parseWinGoData(data);
      if(recs.length > 0) {
        this.processRecords(recs);
        updateStatus(true);
        postLog(`✓ API Live: ${recs.length} records`);
      }
    }
    this.isPolling = false;
  }

  processRecords(records) {
    records.sort((a, b) => String(b.period).localeCompare(String(a.period)));
    const latest = records[0];
    if(!latest) return;

    this.engine.insert(latest);
    const nextPeriod = String(parseInt(latest.period) + 1);
    const result = this.engine.computeSignal(nextPeriod);
    renderUI(nextPeriod, result.signal, result.confidence);
  }
}

// ============ UI RENDERING ============
const engine = new AdvancedDecisionEngine();
const api = new ReliableWinGoAPI(engine);

function postLog(msg) {
  const log = document.getElementById('logConsole');
  const timestamp = new Date().toLocaleTimeString();
  log.innerHTML += `<br>[${timestamp}] ${msg}`;
  log.scrollTop = log.scrollHeight;
  const parts = log.innerHTML.split('<br>');
  if(parts.length > 150) log.innerHTML = parts.slice(-80).join('<br>');
}

function updateStatus(online) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if(online) {
    dot.className = 'status-dot connected';
    txt.innerText = 'LIVE';
    txt.style.color = '#00ff66';
  } else {
    dot.className = 'status-dot';
    txt.innerText = 'CONNECTING';
    txt.style.color = '#ffaa00';
  }
}

function renderUI(period, signal, confidence) {
  document.getElementById('period').innerText = `⏳ TARGET: #${String(period).slice(-10)}`;
  const predEl = document.getElementById('pred');
  predEl.innerText = signal === 'PASS' ? '—' : signal;
  predEl.className = 'prediction ' + (signal.toLowerCase());

  document.getElementById('confDisplay').innerText = `${confidence}%`;
  const confBar = document.getElementById('confBar');
  confBar.style.width = `${Math.min(confidence, 100)}%`;

  document.getElementById('strategy').innerText = engine.strategy.substring(0, 20);
  
  const recentSizes = engine.history.slice(0, 10).map(h => h.size);
  const bigCount = recentSizes.filter(s => s === 'BIG').length;
  const ratio = bigCount / recentSizes.length;
  document.getElementById('trend').innerText = ratio > 0.6 ? '📈 BIG_BIAS' : ratio < 0.4 ? '📉 SMALL_BIAS' : '↔️ BALANCED';

  document.getElementById('winRate').innerText = `${engine.getWinRate()}%`;
  
  let streak = engine.consecutiveWins > 0 ? `🔥 W${engine.consecutiveWins}` : engine.consecutiveLosses > 0 ? `❄️ L${engine.consecutiveLosses}` : '✨ NEUTRAL';
  document.getElementById('streak').innerText = streak;

  const levelColors = { 1: '🟢', 2: '🟡', 3: '🔴' };
  document.getElementById('level').innerText = `${levelColors[engine.level]} L${engine.level}`;

  const recentPattern = engine.history.slice(0, 12).map(h => h.size.charAt(0)).join(' ');
  document.getElementById('pattern').innerText = `◈ ${recentPattern || 'SYNCING'} ◈`;

  renderHeatMap();
}

function renderHeatMap() {
  const heat = document.getElementById('heatMap');
  heat.innerHTML = '';
  const patterns = ['SHORT', 'MEDIUM', 'LONG', 'MOMENTUM', 'CLUSTERING'];
  const analysis = engine.analyzer.analyze(engine.history);

  for(const p of patterns) {
    const data = analysis[p.toLowerCase()] || {};
    const conf = Math.round((data.confidence || 0.5) * 100);
    const cell = document.createElement('div');
    cell.className = 'heat-cell';
    if(conf >= 80) cell.className += ' strong';
    else if(conf >= 65) cell.className += ' medium';
    else cell.className += ' weak';
    cell.innerText = `${p}\n${conf}%`;
    heat.appendChild(cell);
  }
}

// ============ INITIALIZATION ============
document.getElementById('resetBtn').addEventListener('click', () => {
  engine.reset();
  document.getElementById('logConsole').innerHTML = '[SYS] ENGINE RESET';
  renderUI('------', 'PASS', 0);
});

document.getElementById('forcePollBtn').addEventListener('click', () => { api.poll(); });

window.addEventListener('DOMContentLoaded', () => {
  postLog('🚀 QUANT-SHIELD V18 ULTIMATE ONLINE');
  postLog('✨ Next-Gen Multi-Level Pattern Recognition Active');
  postLog('🛡️ Anti-Consecutive-Loss Mode: ENABLED');
  api.poll();
  setInterval(() => api.poll(), api.pollInterval);
});

window._engine = engine;
window._api = api;
</script>
